spring:
  application:
    name: medflow-ai
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/medflow}
    # Local credentials belong in ./config/application.yml (git-ignored) or in the
    # DB_USERNAME / DB_PASSWORD environment variables — never in the repository.
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: medflow-pool
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      # Migrations own the schema; Hibernate only validates it and fails fast on drift.
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    # db/migration holds the schema, scanned recursively as db/migration/<module>/V<n>__*.sql
    # db/demo holds the sample workspace — drop it for a clean production database:
    #   FLYWAY_LOCATIONS=classpath:db/migration
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/demo}
    baseline-on-migrate: true
    # Older local databases may contain the retired V101/V102 profile migrations.
    # Their schema is upgraded by V103 below, so missing script validation is safe here.
    ignore-migration-patterns: ${FLYWAY_IGNORE_MIGRATION_PATTERNS:*:missing}
    # Seed data contains BCrypt hashes and JSON; never treat ${...} as a placeholder.
    placeholder-replacement: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

medflow:
  security:
    jwt:
      # HS256 requires >= 32 bytes. Override in every non-local environment.
      secret: ${JWT_SECRET:medflow-local-dev-secret-change-me-0123456789}
      issuer: medflow-ai
      access-token-ttl: ${JWT_TTL:PT8H}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://localhost:3000}
  cache:
    # "simple" keeps local development dependency-free (in-memory caches).
    # Set to "redis" when a Redis instance is available.
    provider: ${CACHE_PROVIDER:simple}

springdoc:
  api-docs.path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true

logging:
  pattern.level: "%5p [traceId=%X{traceId:-}]"
  level:
    com.medflow: ${LOG_LEVEL:INFO}
